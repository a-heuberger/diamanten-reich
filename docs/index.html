/* Gestaltung: „Schatzreich“ in Türkis und Gold. Heller, verspielter Hintergrund wie Lagune und Sandstrand,
   oben ein tieftürkiser Kopf mit goldenem Namen, darunter große, runde Karten. Diamanten in Weiß, Gold und Rosa.
   Schriften rund (Fredoka für Überschriften, Nunito für Text). Alles groß antippbar: Das Kind kann noch nicht lesen. */
:root {
  color-scheme: light;
  --deep: #0b5563;
  --deeper: #073d48;
  --sea: #13a3a6;
  --sea-2: #2cc6c3;
  --aqua: #bff3ef;
  --panel: rgba(255, 255, 255, .88);
  --panel-solid: #ffffff;
  --pearl: #fffaf2;
  --line: rgba(16, 110, 120, .16);
  --line-2: rgba(16, 110, 120, .3);
  --ink: #123e48;
  --ink-2: #3f6b74;
  --ink-3: #6d959c;
  --gold: #ffc93c;
  --gold-2: #ffe08a;
  --gold-deep: #c98a0c;
  --gold-ink: #5a3a00;
  --pink: #ff7eb6;
  --pink-deep: #d94f8d;
  --rose: #ffe2ef;
  --violet: #8a5ce6;
  --lav: #f0e8ff;
  --mint: #5ad48c;
  --storm: #6f739e;
  --sun: #ffd84d;
  --f-display: 'Fredoka', 'Nunito', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --f-body: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --sh: 0 8px 24px rgba(11, 85, 99, .14);
  --sh-2: 0 3px 0 rgba(11, 85, 99, .14);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: #c9f6f1; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.35; font-weight: 600;
  -webkit-tap-highlight-color: transparent; overflow-x: hidden; min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--deeper); }
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:disabled { cursor: default; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul { list-style: none; }
b { font-weight: 800; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
svg { flex: none; }

.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(60% 30% at 85% 8%, rgba(255, 255, 255, .7), transparent 70%),
    radial-gradient(50% 26% at 8% 32%, rgba(255, 226, 239, .75), transparent 70%),
    radial-gradient(70% 30% at 70% 78%, rgba(240, 232, 255, .7), transparent 70%),
    linear-gradient(180deg, #9eeeea 0%, #c9f6f1 40%, #e6fbf6 70%, #fff4dd 100%);
}
.bg::after {
  content: ""; position: absolute; inset: 0; opacity: .55;
  background-image: radial-gradient(circle, #fff 1.4px, transparent 1.6px), radial-gradient(circle, rgba(255, 201, 60, .9) 1.2px, transparent 1.4px);
  background-size: 64px 64px, 92px 92px; background-position: 10px 20px, 40px 60px;
}
#app, #layer, #celeb, #toast { position: relative; z-index: 1; }
.pwa #app { padding-top: env(safe-area-inset-top, 0px); }
.wrap { width: 100%; max-width: 580px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main { padding-top: 10px; padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; }
.eyebrow { font: 800 12px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.hint { color: var(--ink-2); font-size: 15px; font-weight: 600; }
.hint.err { color: var(--pink-deep); }
.card { background: var(--panel); border: 2px solid rgba(255, 255, 255, .9); border-radius: 26px; box-shadow: var(--sh); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.pad { padding: 16px; }
.emo { line-height: 1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }

/* ---------- Ladeanzeige ---------- */
.boot { min-height: 70vh; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; padding: 24px; }
.boot p { font: 600 22px var(--f-display); color: var(--deep); }
.hop { animation: hop 1s cubic-bezier(.3, 0, .4, 1) infinite; filter: drop-shadow(0 10px 10px rgba(11, 85, 99, .25)); }
@keyframes hop { 0%, 100% { transform: translateY(0) } 45% { transform: translateY(-34px) rotate(8deg) } }

/* ---------- Kopf ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: linear-gradient(180deg, var(--deeper), var(--deep)); color: #fff; box-shadow: 0 4px 16px rgba(7, 61, 72, .25); border-bottom: 3px solid var(--gold); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 8px; padding-bottom: 8px; }
.who { display: flex; align-items: center; gap: 9px; min-width: 0; }
.who .girl-head { display: block; background: radial-gradient(circle at 50% 45%, #fff 0 52%, rgba(255, 255, 255, 0) 53%); border-radius: 50%; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .3)); }
.who-tx { display: grid; min-width: 0; }
.nmrow { display: flex; align-items: center; gap: 4px; min-width: 0; }
.nm { font: 700 25px/1.05 var(--f-display); color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 0 rgba(0, 0, 0, .2); }
.hflag { display: inline-flex; }
.chips { display: flex; align-items: center; gap: 6px; flex: none; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 5px; height: 38px; padding: 0 11px; border-radius: 999px; background: rgba(255, 255, 255, .14); border: 1.5px solid rgba(255, 255, 255, .25); font: 700 19px/1 var(--f-display); color: #fff; }
.chip > svg { width: 20px; height: 20px; }
.chip.spark > svg { color: var(--gold); }
.chip.gems .gem { width: 22px; height: auto; }
.lockbtn { width: 40px; justify-content: center; padding: 0; }
.lockbtn svg { width: 21px; height: 21px; }
.lockbtn.on { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.dot-badge { position: absolute; top: -6px; right: -7px; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 999px; background: var(--violet); color: #fff; font: 800 12.5px/21px var(--f-body); font-style: normal; text-align: center; border: 2px solid #fff; }
.dot-badge.pink { background: var(--pink-deep); animation: nudge 1.6s ease-in-out infinite; }
.dot-badge.gold { background: var(--gold); color: var(--gold-ink); }
@keyframes nudge { 0%, 70%, 100% { transform: scale(1) } 80% { transform: scale(1.25) } 90% { transform: scale(.95) } }

/* ---------- Tab-Leiste ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: rgba(255, 250, 242, .94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 2px solid rgba(16, 110, 120, .12); box-shadow: 0 -6px 20px rgba(11, 85, 99, .1); }
.tabs-in { display: flex; gap: 6px; max-width: 580px; margin: 0 auto; }
.tab { position: relative; flex: 1; display: grid; justify-items: center; gap: 2px; padding: 7px 4px 6px; border: 0; border-radius: 18px; background: none; color: var(--ink-3); font: 700 13.5px var(--f-display); }
.tab svg { width: 27px; height: 27px; }
.tab[aria-current="page"] { background: linear-gradient(180deg, #d8fbf7, #b4f0ea); color: var(--deep); box-shadow: inset 0 0 0 2px rgba(19, 163, 166, .35); }
.tab .dot-badge { top: 0; right: calc(50% - 26px); }

/* ---------- Knöpfe ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 0; font: 700 17px var(--f-display); text-decoration: none; }
.btn svg { width: 20px; height: 20px; }
.btn-main { background: linear-gradient(180deg, #2fd0cc, var(--sea)); color: #fff; box-shadow: 0 4px 0 #0c7f82, 0 8px 18px rgba(19, 163, 166, .3); }
.btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0 #0c7f82; }
.btn-ghost { background: rgba(255, 255, 255, .9); color: var(--deep); border: 2px solid var(--line-2); }
.btn-danger { background: var(--pink-deep); color: #fff; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 15px; }
.btn-xs { min-height: 34px; padding: 0 12px; font-size: 14px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; }
.linkbtn { border: 0; background: none; color: var(--sea); font-weight: 800; text-decoration: underline; padding: 0; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- Sperrseiten und Hinweise ---------- */
.gate { padding: 26px 20px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.gate h2 { font: 700 26px var(--f-display); color: var(--deep); }
.gate-art { margin-bottom: 2px; }
.gate .field { width: 100%; }
.warn-box { background: #fff8e1; border: 2px solid #ffd77a; border-radius: 20px; padding: 13px 15px; display: grid; gap: 8px; color: #6a4b00; }
.warn-box .adv { display: grid; gap: 8px; padding-left: 0; }
.warn-box .adv li { line-height: 1.35; }
.mode-note { text-align: center; }

/* ---------- Wolken oben ---------- */
.cloudtop { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; border-radius: 22px; border: 2px solid; box-shadow: var(--sh); }
.cloudtop.yellow { background: #fff8d6; border-color: #ffd84d; color: #6a4b00; }
.cloudtop.red { background: #eceefa; border-color: #a9acd2; color: #2e3160; }
.ct-tx { flex: 1; display: grid; gap: 1px; }
.ct-tx b { font: 700 19px var(--f-display); }
.ct-tx small { font-size: 14px; line-height: 1.3; }
.cloud-ic { display: block; }
.cloudtop .cloud-ic { animation: drift 4s ease-in-out infinite; }
@keyframes drift { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(4px) } }

/* ---------- Tagesleiste ---------- */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.pill { position: relative; display: grid; justify-items: center; gap: 1px; padding: 6px 0 5px; border-radius: 16px; border: 2px solid transparent; background: rgba(255, 255, 255, .72); color: var(--ink-2); }
.pill .wd { font: 800 11.5px var(--f-body); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }
.pill .dn { font: 700 19px/1.1 var(--f-display); color: var(--ink); }
.pill .st { height: 18px; display: grid; place-items: center; }
.pill .st .gem, .pill .st .crown { width: 18px; height: auto; }
.pill.today { border-color: var(--gold); background: #fffdf3; }
.pill.sel { background: var(--deep); border-color: var(--deep); }
.pill.sel .wd, .pill.sel .dn { color: #fff; }
.pill.fut { opacity: .45; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(16, 110, 120, .2); display: block; }
.dot.loss { background: #b8c7cb; }
.pcls { position: absolute; top: 3px; right: 3px; display: flex; gap: 2px; }
.pcl { width: 8px; height: 6px; border-radius: 4px; }
.pcl.y { background: var(--sun); box-shadow: 0 0 0 1px #d9a400; }
.pcl.r { background: var(--storm); }

/* ---------- Schatzszene ---------- */
.scene { overflow: hidden; padding: 0; border-color: #fff; }
.stage { position: relative; height: 222px; overflow: hidden; background: linear-gradient(180deg, #8fe8f0 0%, #c5f6f2 58%, #fff6dc 100%); cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.stage .sun { position: absolute; left: 14px; top: 12px; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle, #fff7c2 0 40%, #ffd84d 41% 62%, rgba(255, 216, 77, 0) 63%); box-shadow: 0 0 30px rgba(255, 216, 77, .7); }
.sc-cloud { position: absolute; width: 70px; height: 22px; border-radius: 20px; background: #fff; opacity: .9; }
.sc-cloud::before, .sc-cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.sc-cloud::before { width: 30px; height: 30px; left: 12px; top: -14px; }
.sc-cloud::after { width: 24px; height: 24px; left: 34px; top: -9px; }
.sc-cloud.c1 { left: 76px; top: 26px; animation: float 14s linear infinite alternate; }
.sc-cloud.c2 { left: 180px; top: 12px; transform: scale(.7); opacity: .7; animation: float 18s linear infinite alternate-reverse; }
@keyframes float { from { margin-left: 0 } to { margin-left: 40px } }
.ground { position: absolute; left: -10%; right: -10%; bottom: -44px; height: 92px; border-radius: 50% 50% 0 0 / 60% 60% 0 0; background: linear-gradient(180deg, #f3d79a, #d9ac62); box-shadow: inset 0 6px 0 rgba(255, 255, 255, .35); }
.girl-wrap { position: absolute; left: 4%; bottom: 16px; width: 112px; transform-origin: 50% 100%; }
.girl-wrap svg { display: block; overflow: visible; width: 100%; height: auto; }
.girl .tool { transform-box: view-box; transform-origin: 78px 86px; }
.girl-wrap.dig .tool { animation: shovel .34s cubic-bezier(.3, .1, .4, 1); }
.girl-wrap.dig .girl-body { animation: bob .34s ease-out; transform-box: view-box; transform-origin: 60px 140px; }
.girl-wrap.cheer { animation: cheer .7s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes shovel { 0% { transform: rotate(0) } 35% { transform: rotate(16deg) translateY(6px) } 70% { transform: rotate(-14deg) translateY(-4px) } 100% { transform: rotate(0) } }
@keyframes bob { 0%, 100% { transform: none } 40% { transform: translateY(3px) scaleY(.97) } }
@keyframes cheer { 0%, 100% { transform: none } 40% { transform: translateY(-22px) } 70% { transform: translateY(0) scale(1.03, .96) } }
.mound { position: absolute; left: calc(4% + 82px); bottom: 10px; width: 84px; height: 34px; }
.mound::before { content: ""; position: absolute; inset: 6px 0 0; border-radius: 50% 50% 40% 40%; background: radial-gradient(ellipse at 50% 30%, #c98d4d, #9b6430); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .25); transition: transform .2s; }
.mound .hole { position: absolute; left: 50%; top: 10px; width: 12px; height: 6px; margin-left: -6px; border-radius: 50%; background: #5a3418; transition: all .2s; }
.mound.s1 .hole { width: 26px; height: 9px; margin-left: -13px; }
.mound.s2 .hole { width: 40px; height: 12px; margin-left: -20px; box-shadow: 0 0 12px 3px rgba(255, 246, 200, .9); }
.mound.s3 .hole { width: 52px; height: 14px; margin-left: -26px; box-shadow: 0 0 18px 6px rgba(255, 246, 200, 1); }
.mound.s2::before, .mound.s3::before { transform: scale(1.06, .94); }
.wait-bubble { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px 3px 6px; border-radius: 999px; background: #fff; color: var(--deep); font: 700 17px var(--f-display); box-shadow: 0 3px 10px rgba(11, 85, 99, .25); animation: bubble 1.4s ease-in-out infinite; white-space: nowrap; }
.wait-bubble::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-top-color: #fff; border-bottom: 0; }
@keyframes bubble { 0%, 100% { transform: translate(-50%, 0) } 50% { transform: translate(-50%, -5px) } }
.chest-wrap { position: absolute; right: 3%; bottom: 8px; width: 136px; }
.chest-wrap svg { display: block; width: 100%; height: auto; }
.chest-wrap.bump { animation: bump .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { 0%, 100% { transform: none } 40% { transform: scale(1.08, .94) } 70% { transform: scale(.97, 1.04) } }
.uni-wrap { position: absolute; right: calc(3% + 30px); bottom: 116px; width: 74px; animation: uni 3.2s ease-in-out infinite; }
.uni-wrap svg { display: block; width: 100%; height: auto; }
@keyframes uni { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
.dirt { position: absolute; inset: 0; pointer-events: none; }
.clod { position: absolute; width: 9px; height: 8px; border-radius: 50%; background: #a8692f; animation: clod .65s cubic-bezier(.2, .6, .4, 1) forwards; }
.clod:nth-child(3n) { background: #c98d4d; width: 6px; height: 6px; }
@keyframes clod { 0% { transform: translate(0, 0); opacity: 1 } 60% { transform: translate(calc(var(--dx) * .7), var(--dy)); opacity: 1 } 100% { transform: translate(var(--dx), 10px); opacity: 0 } }
.tw { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s ease-in-out infinite; }
.tw.t1 { animation-delay: .45s } .tw.t2 { animation-delay: .9s } .tw.t3 { animation-delay: 1.35s }
@keyframes twinkle { 0%, 100% { transform: scale(.3); opacity: .2 } 50% { transform: scale(1); opacity: 1 } }
.scene-bar { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--pearl); border-top: 2px solid rgba(255, 201, 60, .45); }
.sb-tx { flex: 1; display: grid; gap: 2px; min-width: 0; }
.sb-tx b { font: 700 17px/1.2 var(--f-display); color: var(--deep); }
.sb-tx small { font-size: 13.5px; color: var(--ink-2); }
.digbtn { position: relative; flex: none; display: grid; justify-items: center; gap: 2px; min-width: 124px; padding: 9px 14px 8px; border-radius: 22px; border: 0; background: linear-gradient(180deg, #ffe58a, var(--gold) 55%, #f0a91c); color: var(--gold-ink); box-shadow: 0 5px 0 #b67a0a, 0 10px 18px rgba(201, 138, 12, .35); overflow: hidden; }
.digbtn > svg { width: 30px; height: 30px; }
.digbtn > span { font: 700 21px/1 var(--f-display); }
.digbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b67a0a; }
.digbtn.hot { animation: pulse 1.3s ease-in-out infinite; }
.digbtn[disabled] { filter: grayscale(.7); opacity: .6; animation: none; }
@keyframes pulse { 0%, 100% { box-shadow: 0 5px 0 #b67a0a, 0 0 0 0 rgba(255, 201, 60, .6) } 50% { box-shadow: 0 5px 0 #b67a0a, 0 0 0 10px rgba(255, 201, 60, 0) } }
.pips { display: flex; gap: 5px; margin-top: 3px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; background: rgba(90, 58, 0, .2); transition: background .15s, transform .15s; }
.pips i.on { background: #fff; box-shadow: 0 0 0 2px var(--gold-ink) inset; transform: scale(1.15); }
.digbtn .charge { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: var(--pink); }
.digbtn.charging .charge { width: 100%; transition: width .6s linear; }
.flygem { position: fixed; left: 0; top: 0; z-index: 70; pointer-events: none; filter: drop-shadow(0 0 10px rgba(255, 255, 255, .9)); }

/* ---------- Früherer Tag ---------- */
.back-today { justify-self: start; }
.pastday { display: grid; gap: 8px; }
.pd-top { display: flex; align-items: center; justify-content: space-between; font: 700 19px var(--f-display); color: var(--deep); }
.pd-gems { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.pd-gems em { font-style: normal; font-weight: 800; color: var(--ink-2); }

/* ---------- Aufgaben ---------- */
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 4px 0; }
.sec-h h2 { display: flex; align-items: center; gap: 7px; font: 700 22px var(--f-display); color: var(--deep); }
.sec-h h2 svg { width: 24px; height: 24px; }
.sec-h h3 { font: 700 18px var(--f-display); color: var(--deep); }
.slot-h.morgens h2 svg { color: #f5a623; }
.slot-h.abends h2 svg { color: var(--violet); }
.tasks { display: grid; gap: 10px; }

.pl-go { flex: none; display: inline-flex; align-items: center; gap: 2px; padding: 8px 8px 8px 12px; border-radius: 999px; background: var(--violet); color: #fff; font: 700 15px var(--f-display); box-shadow: 0 3px 0 #5c37a8; }

.tl-gem { flex: none; }
.hint.big { font-size: 17px; color: var(--ink); }

.more-goals { justify-self: center; }

.stpoints { padding: 14px; display: grid; gap: 10px; }
.sp-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.sp-n, .sp-bonus { display: flex; align-items: baseline; gap: 6px; }

.rsw { width: 14px; height: 14px; border-radius: 5px; display: inline-block; }
.rsw.n { background: #9fe3df; } .rsw.r { background: #c3a2ff; } .rsw.u { background: linear-gradient(135deg, #ffd45a, #ff7eb6, #6fe3dc); }
.cat-h { padding-top: 4px; }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
.sticker { position: relative; border: 0; padding: 4px; border-radius: 20px; background: #9fe3df; aspect-ratio: 4 / 5; }

/* ---------- Eltern ---------- */

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 18px; border: 2px solid var(--line); background: #fff; text-align: left; }

.kid-prev, .ob-prev { display: flex; align-items: flex-end; justify-content: center; gap: 12px; padding: 10px; border-radius: 22px; background: linear-gradient(180deg, #a5edf0, #fff6dc); }
.tlist { display: grid; gap: 8px; }

.trow { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 16px; border: 2px solid var(--line); background: #fff; text-align: left; }

/* Schätze bereinigen: nach Diamanten sortiert, jede Zahl nur einmal, Belohnung als Text. Ohne brauchbare Liste gelten die Vorgaben. */
function normGoals(list, dflt) {
  const out = [], used = {};
  (Array.isArray(list) ? list : []).forEach(g => {
    const at = Math.round(+(g && g.at));
    if (!isFinite(at) || at < 1 || at > 100000) return;
    let id = String((g && g.id) || 'g' + at); while (used[id]) id += 'x';
    used[id] = 1;
    out.push({ id, at, reward: String(g.reward == null ? '' : g.reward).slice(0, 120) });
  });
  out.sort((a, b) => a.at - b.at);
  for (let i = 1; i < out.length; i++) if (out[i].at <= out[i - 1].at) out[i].at = out[i - 1].at + 1;
  return out.length ? out : dflt.map(g => Object.assign({}, g));
}
const clampInt = (v, a, b, dflt) => { const n = Math.round(+v); return isFinite(n) ? Math.max(a, Math.min(b, n)) : dflt; };
const pickKey = (obj, k, dflt) => (Object.prototype.hasOwnProperty.call(obj, k) ? k : dflt);

/* Fehlende Felder aus den Voreinstellungen ergänzen, Werte in gültige Bereiche bringen (alte Daten bleiben nutzbar). */
function migrateCfg(c) {
  const d = defaultCfg();
  const old = c || {};
  const out = Object.assign({}, d, old);
  out.name = String(out.name == null ? d.name : out.name).slice(0, 20);
  out.unicorn = String(out.unicorn == null ? d.unicorn : out.unicorn).slice(0, 20);
  const lk = old.look || {};
  out.look = { hair: pickKey(HAIR, lk.hair, d.look.hair), style: pickKey(STYLE, lk.style, d.look.style), dress: pickKey(DRESS, lk.dress, d.look.dress) };
  out.tasks = (Array.isArray(old.tasks) ? old.tasks : d.tasks).map(t => {
    const n = Object.assign({ icon: '⭐', title: '', slot: 'morgens', pts: 1, days: [0, 1, 2, 3, 4, 5, 6] }, t);
    n.slot = SLOTS[n.slot] ? n.slot : 'morgens';
    n.pts = clampInt(n.pts, 1, 3, 1);
    if (!Array.isArray(n.days) || !n.days.length) n.days = [0, 1, 2, 3, 4, 5, 6];
    delete n.bonus; delete n.sub;
    return n;
  });
  out.chest = { title: String((old.chest && old.chest.title) || d.chest.title).slice(0, 40) };
  out.goals = normGoals(old.goals, d.goals);
  /* Fassung 1 hatte leere Belohnungen: Die Vorgabe-Schätze bekommen die Beispiele, eigene Texte bleiben. */
  if ((old.v || 0) < 2) out.goals.forEach(g => { const dg = d.goals.find(x => x.id === g.id && x.at === g.at); if (dg && !String(g.reward || '').trim()) g.reward = dg.reward; });
  out.yellowPts = clampInt(out.yellowPts, 0, 5, d.yellowPts);
  out.redPts = clampInt(out.redPts, 1, 9, d.redPts);
  out.extraMax = clampInt(out.extraMax, 1, 10, d.extraMax);
  out.packEvery = clampInt(out.packEvery, 3, 20, d.packEvery);
  out.digTaps = clampInt(out.digTaps, 1, 5, d.digTaps);
  out.digMode = out.digMode !== false;
  out.digFun = out.digFun !== false;
  out.games = out.games !== false;
  if (!Array.isArray(out.goodReasons)) out.goodReasons = d.goodReasons;
  out.v = CFG_V;
  return out;
}

/* „2,5“, „2.50“, „€ 3“ → Cent. Nur Beträge über 0 bis 1000 €, sonst null. */
function parseMoney(s) {
  const t = String(s == null ? '' : s).replace(/[€\s\u00a0]/g, '').replace(/^\+/, '');
  if (!/^\d{1,4}([.,]\d{1,2})?$/.test(t)) return null;

  return c > 0 && c <= 100000 ? c : null;
}

function rewardMoney(text) {

   Zwei offene Gelbe = automatisch Gewitterwolke. Gewitter (k: 'r') kostet redPts (höchstens einmal pro Tag) und vertreibt die Gelben.
   Das Minus zählt bei den Schätzen; die Diamanten des Tages und in der Truhe bleiben unberührt.
   Extra-Diamanten (k: '+') aus einem eigenen Grund, höchstens extraMax pro Tag.
   Automatische Gewitter sind abgeleitet, nicht gespeichert: Wird ein Eintrag gelöscht, rechnet sich alles neu.
   Der automatische Eintrag merkt sich in src die zweite Gelbe, die ihn ausgelöst hat. */
function buildLedger(S) {
  const cfg = S.cfg, limit = 2;
  const yPts = Math.max(0, +cfg.yellowPts || 0), rPts = Math.max(0, +cfg.redPts || 0);
  const xMax = Math.max(0, cfg.extraMax == null ? 3 : +cfg.extraMax);
  const dates = Object.keys(S.days).filter(ds => (S.days[ds].ev || []).length).sort();
  const byDay = {};
  let active = [];
  for (const ds of dates) {
    const L = { plus: 0, plusRaw: 0, plusN: 0, yellow: 0, red: 0, autoRed: 0, minus: 0, entries: [] };
    let redDone = false;
    const storm = (auto, e, src) => {
      const counts = !redDone; redDone = true;
      if (auto) L.autoRed++; else L.red++;
      if (counts) L.minus += rPts;
      active = [];
      L.entries.push(auto ? { k: 'r', auto, capped: !counts, src } : Object.assign({}, e, { capped: !counts }));
    };
    for (const e of S.days[ds].ev) {
      if (e.k === '+') { L.plusRaw += Math.max(1, Math.round(+e.v) || 1); L.plusN++; L.entries.push(e); }
      else if (e.k === 'r') storm(null, e);
      else if (e.k === 'y') {
        active.push(ds); L.yellow++; L.minus += yPts; L.entries.push(e);
        if (active.length >= limit) storm('sum', null, e.id);
      }
    }
    L.plus = Math.min(L.plusRaw, xMax);
    byDay[ds] = L;
  }
  return { byDay, active, limit };
}
function ledgerOf(S) {
  if (S._ledger && S._v !== undefined && S._lv === S._v) return S._ledger;
  S._ledger = buildLedger(S); S._lv = S._v;

}
const touch = S => { S._v = (S._v || 0) + 1; };

/* Offene gelbe Wolken (verfallen nie, bis eine Gewitterwolke sie vertreibt). */
function cloudsNow(S) {
  const lg = ledgerOf(S);
  return { count: lg.active.length, limit: lg.limit, dates: lg.active.slice() };
}

/* ---------- Ein Tag ----------
   Zustände je Aufgabe: y = geschafft (Diamant), n = nicht geschafft (neutral), c = vom Kind getippt (nur alte Daten, wartet auf die Eltern).
   gain = Diamanten des Tages (freigegebene Aufgaben und Extra-Diamanten). dug = davon ausgegraben, waiting = noch in der Erde. */
function evalDay(S, ds) {
  const day = S.days[ds] || {};
  const r = { ds, items: [], max: 0, gain: 0, plus: 0, plusN: 0, minus: 0, open: 0, claimed: 0, ok: 0, na: 0, appN: 0, judged: 0, hasData: false, result: 'none', perfect: false, complete: false, entries: [], yellow: 0, red: 0, dug: 0, waiting: 0 };
  const m = day.m || {};
  let gain = 0;
  r.items = tasksOn(S, ds).map(t => {
    const st = m[t.id] || null;
    r.appN++; r.max += t.pts;
    if (st === 'y') { gain += t.pts; r.ok++; }
    else if (st === 'n') r.na++;
    else { r.open++; if (st === 'c') r.claimed++; }
    return { t, st };
  });
  const led = ledgerOf(S).byDay[ds];
  if (led) {
    r.plus = led.plus; r.plusN = led.plusN; r.entries = led.entries;
    r.yellow = led.yellow; r.red = led.red + led.autoRed;
    r.minus = led.minus;
  }
  r.gain = gain + r.plus;
  const dg = Math.max(0, Math.round(+day.dg) || 0);
  r.dug = S.cfg.digMode === false ? r.gain : Math.min(dg, r.gain);
  r.waiting = r.gain - r.dug;
  r.judged = r.ok + r.na;
  r.hasData = r.judged > 0 || r.gain > 0;
  if (r.gain > 0) r.result = 'win';
  else if (r.judged > 0 && r.open === 0) r.result = 'loss';
  r.perfect = r.appN > 0 && r.ok === r.appN && r.red === 0 && r.yellow === 0;
  r.complete = r.appN > 0 && r.open === 0;
  return r;
}

/* ---------- Eine Woche (Montag bis Sonntag) ---------- */
function evalWeek(S, mon) {
  const days = [];
  let gems = 0, max = 0, perfect = 0, yellow = 0, red = 0, minus = 0, sparkle = 0;
  for (let i = 0; i < 7; i++) {
    const ds = addDays(mon, i), e = evalDay(S, ds);
    days.push(e); gems += e.gain; max += e.max; if (e.perfect) perfect++; if (e.gain > 0) sparkle++;
    yellow += e.yellow; red += e.red; minus += e.minus;
  }
  return { mon, days, gems, max, perfect, yellow, red, minus, sparkle };
}

/* ---------- Gesamtstand ----------
   total = alle freigegebenen Diamanten plus Bonus-Diamanten der Sticker. Danach richten sich Zauberbeutel und (abzüglich Wolken) die Schätze.
   chest = Diamanten in der Truhe (ausgegraben plus Bonus): Das zeigen Kopf und Truhe. waiting = noch in der Erde.
   Gefeiert wird erst, wenn nichts mehr wartet (siehe actions.js). */

  for (const ds of dates) {
    const e = evalDay(S, ds);
    days += e.gain; dug += e.dug; waiting += e.waiting; minus += e.minus; extras += e.plusN; yellows += e.yellow; reds += e.red;
    if (e.waiting > 0 && !firstWaiting) firstWaiting = ds;
    if (e.perfect) perfect++;

  const total = days + bonus;
  const score = total - minus;
  const every = Math.max(1, +S.cfg.packEvery || 5);
  const earned = 1 + Math.floor(total / every);
  const cel = S.prog.cel || {};
  const last = S.cfg.goals[S.cfg.goals.length - 1];
  return {
    total, minus, score, days, dug, waiting, firstWaiting, chest: dug + bonus, perfect, extras, cur, best, yellows, reds,
    found: !!last && goalReached(S, score, last),
    clouds: cloudsNow(S),
    stickers: { count: album.length, pts, bonus, toNext: PTS_PER_DIAMANT - (pts % PTS_PER_DIAMANT) },
    packs: { earned, opened: album.length + foil.length, left: packsLeft(earned, album, foil), complete: album.length >= STICKERS.length, foil: foil.length, every, next: every - (total % every) },
    reachedOn: id => { const v = cel['g:' + id]; return typeof v === 'string' ? v : null; },
  };
}

/* Ein Schatz ist erreicht, wenn die Diamanten nach Abzug reichen. Ein eingelöster bleibt erreicht: Eine Belohnung, die schon da ist, nimmt keine Wolke zurück. */
const goalReached = (S, score, g) => score >= g.at || !!(S.prog.red && S.prog.red[g.id]);

function goalList(S, st) {
  const red = S.prog.red || {}, gs = S.cfg.goals;
  return gs.map((g, i) => ({
    id: g.id, at: g.at, reward: g.reward, last: i === gs.length - 1, gem: GOAL_GEMS[Math.min(GOAL_GEMS.length - 1, Math.floor(i * GOAL_GEMS.length / Math.max(1, gs.length)))],
    reached: goalReached(S, st.score, g), need: Math.max(0, g.at - st.score), prev: i ? gs[i - 1].at : 0,
    on: st.reachedOn(g.id), done: red[g.id] || null, money: rewardMoney(g.reward),

}
const nextGoal = (S, st) => goalList(S, st).find(g => !g.reached) || null;

/* Meilensteine vor/nach einer Änderung vergleichen (für Feiern). */
function milestones(S, ds, today) {
  const e = evalDay(S, ds), st = computeStats(S, today);

}

/* Hinweise für die Eltern: Hürde zu hoch? Belohnung offen? Wartet etwas auf Freigabe? */
function parentAdvice(S, today) {
  const out = [];
  let reds = 0;
  for (let i = 0; i < 7; i++) reds += evalDay(S, addDays(today, -i)).red;
  if (reds >= 2) out.push({ kind: 'reds', n: reds });
  const st = computeStats(S, today);
  goalList(S, st).forEach(g => { if (g.reached && !g.done && g.on && daysBetween(g.on, today) >= 7) out.push({ kind: 'open', id: g.id, at: g.at, since: g.on }); });
  const firstEmpty = S.cfg.goals.slice(0, 3).filter(g => !String(g.reward || '').trim()).length;

}

}

        r: Math.random() * 6.28, vr: (Math.random() - .5) * .35, s: 6 + Math.random() * 7,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        e: emojis.length && Math.random() < (o.emojiShare || .2) ? emojis[(Math.random() * emojis.length) | 0] : null,
        shape: Math.random() < .35 ? 'c' : 'r', life: 0, max: (o.life || 2.4) + Math.random() * 1.1, g: o.gravity || .26,
      });
    }
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  }
  function tick(t) {
    const dt = Math.min(2.5, (t - last) / 16.67); last = t;
    cx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.life < p.max && p.y < H + 60);
    for (const p of parts) {
      p.life += dt / 60; p.vx *= .985; p.vy = p.vy * .985 + p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, (p.max - p.life) / .6)); cx.translate(p.x, p.y); cx.rotate(p.r);
      if (p.e) { cx.font = Math.round(p.s * 2.6) + 'px serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(p.e, 0, 0); }
      else {
        cx.fillStyle = p.c;
        if (p.shape === 'c') { cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, 6.3); cx.fill(); } else cx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6);
      }
      cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!raf) cx.clearRect(0, 0, W, H);
  }
  const ok = () => cv && !stillMotion();
  return {
    init,
    /* kleiner Funkelregen an einer Stelle (beim Diamanten) */
    pop(x, y, emojis) { if (ok()) add(x, y, 26, { speed: 7, spread: Math.PI * 1.4, angle: -Math.PI / 2, emojis: emojis || ['💎'], emojiShare: .25, life: 1.7 }); },
    /* große Feier: zwei Kanonen von unten und Regen von oben */
    party(emojis) {
      if (!ok()) return;
      const e = emojis || ['💎', '✨'];
      add(W * .08, H * .92, 70, { angle: -Math.PI * .36, spread: .7, speed: 17, emojis: e, emojiShare: .2, life: 3.2, gravity: .3 });
      add(W * .92, H * .92, 70, { angle: -Math.PI * .64, spread: .7, speed: 17, emojis: e, emojiShare: .2, life: 3.2, gravity: .3 });
      setTimeout(() => add(() => Math.random() * W, -20, 70, { fall: true, still: true, emojis: e, emojiShare: .15, life: 3.6, gravity: .1 }), 350);
    },
    clear() { parts = []; },
  };
})();

/* ============ Speicher: geteilte Datenbank der Seite (db) oder lokal (localStorage) ============
   Dokumente: cfg/main (Einstellungen) · cfg/progress (Feiern, Eingelöstes, Album) · days/<JJJJ-MM-TT> (ein Tag: m = Aufgaben, ev = Extras und Wolken)
   · konto/<id> (eine Buchung auf dem Guthabenkonto; je Buchung ein Dokument, damit zwei Geräte sich nie überschreiben).
   Eigene Änderungen gehen sofort in den Speicher S und werden gebündelt, eines nach dem anderen, geschrieben.
   Das Echo der eigenen Schreibvorgänge wird erkannt und ignoriert, damit es keine Eingaben überschreibt. */
const LS_KEY = 'dia-local-v1';
/* noAccess: Die Seite läuft in Claude, bekommt aber keinen Zugriff auf den gemeinsamen Speicher (nicht angemeldet, nicht freigegeben). */
/* cloud: Web-App mit Firestore (siehe cloud.js). gate: Sperrseite statt Spiel (nolink, denied, sdk, offline). cred: Zugangsdaten dieses Geräts. */
const Store = { mode: 'boot', db: null, pend: {}, recent: {}, timers: {}, subs: [], lsOk: false, readyTimer: 0, migrated: false, noAccess: false, cloud: false, gate: null, cred: null, fs: null };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const jclone = o => JSON.parse(JSON.stringify(o));
const isEmptyDay = d => !d || (!d.off && (!d.m || !Object.keys(d.m).length) && (!d.ev || !d.ev.length));

function docBody(key) {
  if (key === 'cfg/main') return jclone(S.cfg);
  if (key === 'cfg/progress') return jclone(S.prog);
  if (key.indexOf('konto/') === 0) { const e = S.konto[key.slice(6)]; return e ? jclone(e) : null; }
  const d = S.days[key.slice(5)];
  return d && !isEmptyDay(d) ? jclone(d) : null;
}
function assignDoc(key, data) {
  if (key === 'cfg/main') { Store.migrated = !!(data && (data.v || 0) < CFG_V); S.cfg = migrateCfg(data); }
  else if (key === 'cfg/progress') S.prog = normProg(data);
  else if (key.indexOf('konto/') === 0) { const id = key.slice(6); if (data) S.konto[id] = data; else delete S.konto[id]; }
  else { const ds = key.slice(5); if (data) S.days[ds] = data; else delete S.days[ds]; }
  markChanged();
}
const busy = key => { const p = Store.pend[key]; return !!((p && (p.busy || p.dirty)) || Store.timers[key]); };
const isEcho = (key, json) => (Store.recent[key] || []).indexOf(json) >= 0;

/* ---- lokal ---- */
function lsLoad() { try { const j = localStorage.getItem(LS_KEY); return j ? JSON.parse(j) : null; } catch (e) { return null; } }
function lsSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ cfg: S.cfg, prog: S.prog, days: S.days, konto: S.konto })); return true; } catch (e) { return false; }
}

/* ---- schreiben ---- */
function persist(key, delay) {
  if (U.readonly || Store.mode === 'boot') return;
  clearTimeout(Store.timers[key]); delete Store.timers[key];
  if (delay) { Store.timers[key] = setTimeout(() => { delete Store.timers[key]; flushKey(key); }, delay); return; }
  flushKey(key);
}
async function flushKey(key) {
  const p = Store.pend[key] || (Store.pend[key] = { dirty: false, busy: false });
  p.dirty = true;
  if (p.busy) return;
  p.busy = true;
  try { while (p.dirty) { p.dirty = false; await writeKey(key); } } finally { p.busy = false; }
}
async function writeKey(key) {
  const body = docBody(key);
  const rec = Store.recent[key] || (Store.recent[key] = []);
  rec.push(JSON.stringify(body)); if (rec.length > 10) rec.shift();
  if (Store.mode !== 'db') { Store.lsOk = lsSave(); return; }
  const ref = Store.db.doc(key);
  const go = () => (body === null ? ref.delete() : ref.set(body));
  /* Firestore legt die Änderung sofort im Zwischenspeicher ab und schickt sie nach, sobald es Netz gibt: Darauf wird nicht gewartet. */
  if (Store.cloud) { go().catch(cloudWriteFail); return; }
  try { await go(); } catch (e) {
    if (e && e.code === 'unavailable') {
      await sleep(500 + Math.random() * 700);
      try { await go(); return; } catch (e2) { e = e2; }
    }
    writeFail(e);
  }
}
function writeFail(e) {
  const c = e && e.code;
  if (c === 'invalid_argument' || c === 'revoked') { U.readonly = true; U.unlocked = false; toast('Hier kann nur angesehen werden.', 'warn'); render(); }
  else if (c === 'quota_exceeded') toast('Der Speicher dieser Seite ist voll.', 'warn');
  else toast('Speichern hat nicht geklappt. Prüfe die Verbindung und tippe nochmal.', 'warn');
}

/* ---- lesen (live) ---- */
function remoteDoc(key, snap) {
  if (busy(key)) return false;
  const data = snap.exists ? jclone(snap.data()) : null, json = JSON.stringify(data);
  if (isEcho(key, json)) return false;
  if (JSON.stringify(docBody(key)) === json) return false;
  assignDoc(key, data);
  return true;
}
function remoteDays(snap) {
  let changed = false;
  snap.docChanges().forEach(c => {
    const id = c.doc.id, key = 'days/' + id;
    if (busy(key)) return;
    const data = c.type === 'removed' ? null : jclone(c.doc.data()), json = JSON.stringify(data);
    if (isEcho(key, json)) return;
    if (JSON.stringify(docBody(key)) === json) return;
    if (!data && !S.days[id]) return;
    assignDoc(key, data); changed = true;
  });
  return changed;
}
function remoteKonto(snap) {
  let changed = false;
  snap.docChanges().forEach(c => {
    const id = c.doc.id, key = 'konto/' + id;
    if (busy(key)) return;
    const data = c.type === 'removed' ? null : jclone(c.doc.data()), json = JSON.stringify(data);
    if (isEcho(key, json)) return;
    if (JSON.stringify(docBody(key)) === json) return;
    if (!data && !S.konto[id]) return;
    assignDoc(key, data); changed = true;
  });
  return changed;
}

/* ---- Start ---- */
function ready() {
  if (U.ready) return;
  U.ready = true; clearTimeout(Store.readyTimer);
  afterLoad(); render();
}
function initLocal(note) {
  Store.subs.forEach(u => { try { u(); } catch (e) { /* schon beendet */ } }); Store.subs = [];
  Store.mode = 'local';
  const d = lsLoad();
  if (d) { Store.migrated = !!(d.cfg && (d.cfg.v || 0) < CFG_V); S.cfg = migrateCfg(d.cfg); S.prog = normProg(d.prog); S.days = d.days || {}; S.konto = d.konto || {}; U.hasCfg = !!d.cfg; markChanged(); }
  else U.hasCfg = false;
  Store.lsOk = Store.noAccess && !U.hasCfg ? false : lsSave();         // ohne Zugriff und ohne eigenen Stand nichts anlegen: sonst käme beim nächsten Öffnen ein leeres Spiel statt der Erklärung
  if (note) toast(note, 'warn');
  ready();
}
async function initStore() {
  if (window.__PWA__) return initCloud();
  let db = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') db = await Promise.race([window.claude.use('db'), sleep(9000).then(() => null)]);
  } catch (e) { db = null; }
  if (!db) { Store.noAccess = !!(window.claude && typeof window.claude.use === 'function'); return initLocal(); }
  Store.db = db; Store.mode = 'db';
  try {
    const user = await window.claude.use('user');
    if (user && (await user.can('data.write')) === false) U.readonly = true;
  } catch (e) { /* unbekannt: ein abgelehnter Schreibversuch entscheidet */ }
  const got = { cfg: false, prog: false, days: false, konto: false };
  const step = () => { if (got.cfg && got.prog && got.days && got.konto) ready(); };
  const redraw = ch => { if (ch && U.ready) render(); };
  const fail = e => {
    if (e && e.code === 'revoked') { U.readonly = true; U.unlocked = false; render(); return; }
    if (!U.ready) initLocal('Die Verbindung zum Speicher klappt gerade nicht. Der Stand liegt vorerst nur auf diesem Gerät.');
  };
  try {
    Store.subs.push(db.doc('cfg/main').onSnapshot(s => { U.hasCfg = !!s.exists; redraw(remoteDoc('cfg/main', s)); got.cfg = true; step(); }, fail));
    Store.subs.push(db.doc('cfg/progress').onSnapshot(s => { redraw(remoteDoc('cfg/progress', s)); got.prog = true; step(); }, fail));
    Store.subs.push(db.collection('days').onSnapshot(s => { redraw(remoteDays(s)); got.days = true; step(); }, fail));
    Store.subs.push(db.collection('konto').onSnapshot(s => { redraw(remoteKonto(s)); got.konto = true; step(); }, fail));
  } catch (e) { return initLocal('Die Verbindung zum Speicher klappt gerade nicht. Der Stand liegt vorerst nur auf diesem Gerät.'); }
  Store.readyTimer = setTimeout(() => { if (!U.ready) ready(); }, 7000);
}

/* ============ Cloud (Web-App): Firestore statt Claude-Speicher ============
   Die Web-App läuft eigenständig (GitHub Pages) und enthält weder Konfiguration noch Zugangscode. Beides steckt im Familienlink:
     https://…/#c=<base64url(JSON { k: Familiencode, f: Firebase-Konfiguration, e: Emulator (nur Tests) })>
   Der Link wird einmal pro Gerät geöffnet oder eingefügt; danach liegt er im lokalen Speicher dieses Geräts.
   Die Daten liegen unter families/<Familiencode>/… in Firestore. Die Sicherheitsregeln lassen nur diesen einen Pfad zu,
   wer den Code nicht kennt, kommt an nichts heran. Der Code steht nie im Quelltext und nie im Repo.
   Dokumente und Schnittstelle sind dieselben wie bei der Claude-Fassung (cfg/main, cfg/progress, days/<Datum>, konto/<id>);
   der Adapter unten bildet die db-Schnittstelle von Claude auf Firestore ab, der Rest der App merkt den Unterschied nicht. */
const CLOUD_KEY = 'dia-cloud-v1';
const CODE_RE = /^[A-Z2-9]{16}$/;
const CFG_KEYS = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];

function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(s) {
  const t = String(s).replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(t + '==='.slice((t.length + 3) % 4));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
/* Prüft und bereinigt Zugangsdaten { k, f, e }; null, wenn sie nicht stimmen. */
function cleanCred(o) {
  if (!o || !CODE_RE.test(String(o.k || '')) || !o.f || !o.f.projectId || !o.f.apiKey) return null;
  const f = {}; CFG_KEYS.forEach(k => { if (typeof o.f[k] === 'string' && o.f[k]) f[k] = o.f[k]; });
  const e = o.e && o.e.host && +o.e.port ? { host: String(o.e.host), port: +o.e.port } : null;
  return { k: o.k, f, e };
}
/* Nimmt den ganzen Link, nur den Teil ab „#c=“ oder die reine Zeichenfolge entgegen. */
function parseFamilyLink(text) {
  const t = String(text || '').trim();
  const m = /[#?&]c=([A-Za-z0-9_-]{20,})/.exec(t) || /^([A-Za-z0-9_-]{40,})$/.exec(t);
  if (!m) return null;
  try { return cleanCred(JSON.parse(b64urlDecode(m[1]))); } catch (e) { return null; }
}
function loadCred() { try { return cleanCred(JSON.parse(localStorage.getItem(CLOUD_KEY))); } catch (e) { return null; } }
function saveCred(c) { try { localStorage.setItem(CLOUD_KEY, JSON.stringify(c)); return true; } catch (e) { return false; } }
function forgetCred() { try { localStorage.removeItem(CLOUD_KEY); } catch (e) { /* egal */ } }
/* Der Link, den man weitergibt: dieselbe Adresse wie die App, mit den Zugangsdaten hinter dem #. */
function familyLink(c) {
  return location.origin + location.pathname + '#c=' + b64urlEncode(JSON.stringify({ k: c.k, f: c.f, e: c.e || undefined }));
}

/* Bildet die db-Schnittstelle (doc/collection/onSnapshot/set/delete) auf Firestore unter families/<Code>/ ab. */
function fsAdapter(FB, fs, code) {
  const base = 'families/' + code + '/';
  const snapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data(), fromCache: !!(s.metadata && s.metadata.fromCache) });
  const api = {
    doc: path => {
      const ref = FB.doc(fs, base + path);
      return {
        id: ref.id, path,
        get: async () => snapDoc(await FB.getDoc(ref)),
        set: d => FB.setDoc(ref, d),
        update: d => FB.updateDoc(ref, d),
        delete: () => FB.deleteDoc(ref),
        onSnapshot: (cb, err, o) => FB.onSnapshot(ref, o && o.meta ? { includeMetadataChanges: true } : {}, s => cb(snapDoc(s)), err),
      };
    },
    collection: path => {
      const ref = FB.collection(fs, base + path);
      return {
        path,
        doc: id => api.doc(path + '/' + id),
        get: async () => { const s = await FB.getDocs(ref); return { docs: s.docs.map(snapDoc), size: s.size, empty: s.empty }; },
        onSnapshot: (cb, err) => FB.onSnapshot(ref, s => cb({ docs: s.docs.map(snapDoc), docChanges: () => s.docChanges().map(c => ({ type: c.type, doc: snapDoc(c.doc) })) }), err),
      };
    },
  };
  return api;
}

/* Zeigt eine Sperrseite (oder nimmt sie weg, wenn kind leer ist). */
function cloudGate(kind) {
  Store.gate = kind || null;
  if (kind) clearTimeout(Store.readyTimer);
  render();
}
function cloudFail(e) {
  if (e && e.code === 'permission-denied') {
    Store.subs.forEach(u => { try { u(); } catch (x) { /* schon beendet */ } }); Store.subs = [];
    cloudGate('denied');
  }
  /* alles andere (kein Netz, kurze Störung): Das SDK versucht es von selbst wieder, geschrieben wird später nach. */
}
function cloudWriteFail(e) {
  const c = e && e.code;
  if (c === 'permission-denied') cloudFail(e);
  else if (c === 'resource-exhausted') toast('Der Tagesvorrat des Speichers ist aufgebraucht. Morgen geht es wieder.', 'warn');
  else if (c !== 'unavailable') toast('Speichern hat nicht geklappt. Prüfe die Verbindung und tippe nochmal.', 'warn');
}

async function initCloud() {
  Store.cloud = true;
  /* Wird ein Familienlink geöffnet, während die App schon läuft (z. B. aus der Nachricht), nimmt sie ihn sofort an. */
  window.addEventListener('hashchange', () => { const c = parseFamilyLink(location.hash); if (c) { saveCred(c); location.reload(); } });
  let cred = parseFamilyLink(location.hash);
  if (cred) saveCred(cred); else cred = loadCred();
  if (!cred) return cloudGate('nolink');
  Store.cred = cred;
  if (!window.FB) return cloudGate('sdk');
  let fs;
  try {
    /* Eigener Name statt „[DEFAULT]“: Die Schwester-App liegt auf demselben Host und teilt sich sonst den IndexedDB-Speicher von Firestore mit dieser. */
    const app = FB.initializeApp(cred.f, 'diamanten');
    let cache; try { cache = FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() }); } catch (e) { cache = FB.memoryLocalCache(); }
    fs = FB.initializeFirestore(app, { localCache: cache, experimentalAutoDetectLongPolling: true });
    if (cred.e) FB.connectFirestoreEmulator(fs, cred.e.host, cred.e.port);
  } catch (e) { return cloudGate('sdk'); }
  Store.fs = fs;
  const db = Store.db = fsAdapter(FB, fs, cred.k); Store.mode = 'db';
  const got = { cfg: false, prog: false, days: false, konto: false };
  const step = () => {
    if (!(got.cfg && got.prog && got.days && got.konto)) return;
    if (Store.gate) { Store.gate = null; if (U.ready) { render(); return; } }
    ready();
  };
  const redraw = ch => { if (ch && U.ready && !Store.gate) render(); };
  /* Ein Dokument, das es im Zwischenspeicher nicht gibt, ist erst „neu“, wenn der Server es bestätigt: sonst würde ein Start ohne Netz wie ein leeres Spiel aussehen. */
  Store.subs.push(db.doc('cfg/main').onSnapshot(s => { if (s.fromCache && !s.exists) return; U.hasCfg = !!s.exists; redraw(remoteDoc('cfg/main', s)); got.cfg = true; step(); }, cloudFail, { meta: true }));
  Store.subs.push(db.doc('cfg/progress').onSnapshot(s => { redraw(remoteDoc('cfg/progress', s)); got.prog = true; step(); }, cloudFail));
  Store.subs.push(db.collection('days').onSnapshot(s => { redraw(remoteDays(s)); got.days = true; step(); }, cloudFail));
  Store.subs.push(db.collection('konto').onSnapshot(s => { redraw(remoteKonto(s)); got.konto = true; step(); }, cloudFail));
  Store.readyTimer = setTimeout(() => { if (!got.cfg && !Store.gate) cloudGate('offline'); }, 9000);
}

/* ============ Zustand und Ansichten ============ */

  bars: {}, newSticker: null, muted: false, ob: null, ex: null, kx: null, game: null, lastGoal: null, dig: { taps: 0 }, digBusy: false, volley: false,

  const lock = U.readonly ? '' : '<button class="chip lockbtn' + (U.unlocked ? ' on' : '') + '" data-act="lock" aria-label="' + (U.unlocked ? 'Eltern-Modus beenden' : 'Eltern-Modus öffnen' + (claimed ? ', ' + claimed + ' Aufgaben warten auf Freigabe' : '')) + '">' + (U.unlocked ? IC.unlock : IC.lock) + badge + '</button>';
  return '<header class="top"><div class="wrap top-in"><div class="who">' + girlHeadSVG(look(), 44) +
    '<div class="who-tx"><span class="nmrow"><b class="nm">' + esc(S.cfg.name) + '</b>' + headerFlags(st) + '</span></div></div>' +
    '<div class="chips"><div class="chip spark" role="img" aria-label="Funkel-Tage in Folge: ' + st.cur + '">' + IC.sparkle + '<b>' + st.cur + '</b></div>' +

}
function tabsView(st) {
  const tabs = [['today', 'Heute'], ['week', 'Woche'], ['achieve', 'Schätze'], ['konto', 'Konto']].concat(U.readonly ? [] : [['coach', 'Eltern']]);
  return '<nav class="tabs" aria-label="Bereiche"><div class="tabs-in">' + tabs.map(t => {
    const badge = t[0] === 'achieve' && st.packs.left > 0 ? '<i class="dot-badge" aria-label="' + st.packs.left + ' Zauberbeutel warten">' + st.packs.left + '</i>'
      : t[0] === 'today' && st.waiting > 0 && S.cfg.digMode !== false ? '<i class="dot-badge gold" aria-label="' + dia(st.waiting) + ' warten in der Erde">' + st.waiting + '</i>' : '';
    return '<button class="tab" data-act="tab" data-tab="' + t[0] + '"' + (U.tab === t[0] ? ' aria-current="page"' : '') + '>' + TAB_IC[t[0]] + badge + '<span>' + t[1] + '</span></button>';
  }).join('') + '</div></nav>';
}

/* Sperrseite statt Spiel: noaccess = Claude-Seite ohne Zugriff, nolink = Web-App ohne Familienlink, denied = Link passt nicht (mehr),
   sdk = Programmteil nicht geladen (erster Start ohne Netz), offline = Stand noch nicht vom Server geholt. */
function gateView(kind) {
  const card = (title, body, extra) => '<main class="wrap main gate-main" id="main"><section class="card gate noconn" data-gate="' + kind + '"><div class="gate-art">' + chestSVG(.25, 120) + '</div><h2>' + title + '</h2>' + body + (extra || '') + '</section></main>';
  if (kind === 'nolink') {
    return card('Familienlink fehlt', '<p class="hint">Diese App zeigt nur den Schatz eurer Familie. Öffne den Familienlink, den du bekommen hast, oder füge ihn hier ein.</p>',
      '<div class="field link-in"><input type="text" id="link-in" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Familienlink hier einfügen" aria-label="Familienlink"></div>' +
      '<p class="hint err" id="link-err" role="alert" hidden>Das ist kein gültiger Familienlink. Es muss der ganze Link sein, mit allem hinter dem #.</p>' +
      '<button class="btn btn-main" data-act="link-save">Verbinden</button>');
  }
  if (kind === 'denied') return card('Der Link passt nicht', '<p class="hint">Mit diesem Familienlink kommt die App nicht an euren Schatz. Vielleicht wurde der Zugang erneuert. Frag nach dem neuen Link und füge ihn ein.</p>', '<button class="btn btn-main" data-act="link-reset">Neuen Link eingeben</button>');
  if (kind === 'sdk') return card('Die App kann nicht starten', '<p class="hint">Beim ersten Start braucht sie Internet. Verbinde dich und versuche es noch einmal.</p>', '<button class="btn btn-main" data-act="reload">Noch einmal versuchen</button>');
  if (kind === 'offline') return card('Noch keine Verbindung', '<p class="hint">Der Schatz wird geladen, sobald das Internet da ist. Du musst nichts tun.</p>', '<button class="btn btn-ghost" data-act="reload">Noch einmal versuchen</button>');
  return card('Hier fehlt die Anmeldung', '<p class="hint">Der Stand liegt in Claude und zeigt sich nur, wenn du dort angemeldet bist und die Seite für dich freigegeben ist. Bitte Mama oder Papa um Hilfe.</p>' +
    '<p class="hint">Für die Eltern: Mit dem Claude-Konto anmelden, in dem die Seite liegt oder für das sie freigegeben wurde, und den Link noch einmal öffnen.</p>');
}
function modeNote() {
  if (Store.noAccess) return '<section class="warn-box mode-note" role="status"><b>Nicht verbunden.</b> Diese Ansicht zeigt nicht den gemeinsamen Stand. Was hier eingetragen wird, bleibt nur auf diesem Gerät.</section>';
  if (U.readonly) return '<p class="hint mode-note" role="note">Nur ansehen: Eintragen und Graben geht hier nicht.</p>';
  return '';
}

/* ---------- Heute ---------- */
/* Ganz oben: gelbe Wolke (offen) und Gewitterwolke (heute), gut sichtbar, mit einem Satz dazu. */
function cloudTop(st) {
  const e = evalDay(S, U.today), c = S.cfg;
  let h = '';
  if (e.red > 0) {
    h += '<section class="cloudtop red" role="status">' + cloudSVG('red', 46) + '<span class="ct-tx"><b>Gewitterwolke heute</b><small>Minus ' + dia(c.redPts) + ' bei den Schätzen. Morgen scheint wieder die Sonne.</small></span></section>';
  }
  if (st.clouds.count > 0) {
    const d = st.clouds.dates[0];
    h += '<section class="cloudtop yellow" role="status">' + cloudSVG('yellow', 46) + '<span class="ct-tx"><b>Gelbe Wolke</b><small>' + (d === U.today ? 'Heute. ' : d ? 'Seit ' + fmtShort(d) + '. ' : '') + (c.yellowPts ? 'Minus ' + dia(c.yellowPts) + ' bei den Schätzen. ' : '') + 'Eine zweite wird zur Gewitterwolke.</small></span></section>';
  }
  return h;
}
function dayStrip(sel) {
  const mon = mondayOf(sel);
  let h = '<nav class="strip" aria-label="Tage der Woche">';
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), e = evalDay(S, d), fut = d > U.today;
    const mark = e.perfect ? '<span class="st">' + crownSVG(18) + '</span>' : e.gain > 0 ? '<span class="st">' + gemMini(16) + '</span>' : '<span class="st"><i class="dot ' + e.result + '"></i></span>';
    const pc = (e.yellow ? '<i class="pcl y"></i>' : '') + (e.red ? '<i class="pcl r"></i>' : '');
    h += '<button class="pill' + (d === sel ? ' sel' : '') + (d === U.today ? ' today' : '') + (fut ? ' fut' : '') + '" data-act="day" data-date="' + d + '"' + (fut ? ' disabled' : '') + ' aria-label="' + WD_LONG[dowOf(d)] + ', ' + parseDate(d).getDate() + '., ' + dia(e.gain) + (e.yellow ? ', gelbe Wolke' : '') + (e.red ? ', Gewitterwolke' : '') + '"' + (d === sel ? ' aria-current="date"' : '') + '>' +
      '<span class="wd">' + WD_SHORT[dowOf(d)] + '</span><span class="dn">' + parseDate(d).getDate() + '</span>' + mark + (pc ? '<span class="pcls" aria-hidden="true">' + pc + '</span>' : '') + '</button>';
  }
  return h + '</nav>';
}

/* Die Schatzszene: links die Schatzgräberin am Erdhügel, rechts die Truhe, darüber das Einhorn. Tippen gräbt. */
function digPips() {
  const n = S.cfg.digTaps, t = U.dig.taps;
  let h = '<span class="pips" aria-hidden="true">';
  for (let i = 0; i < n; i++) h += '<i' + (i < t ? ' class="on"' : '') + '></i>';
  return h + '</span>';
}
function digLabel(st) {
  if (st.waiting > 0) return st.waiting === 1 ? 'Ein Diamant wartet in der Erde!' : dia(st.waiting) + ' warten in der Erde!';
  return S.cfg.digFun ? 'Grab ruhig weiter. Vielleicht findest du etwas!' : 'Alle Diamanten sind in der Truhe.';
}
function sceneCard(st) {
  const c = S.cfg, digOn = c.digMode !== false, can = digOn && !U.readonly && (st.waiting > 0 || c.digFun);
  const gl = goalList(S, st), last = gl[gl.length - 1];
  const level = chestLevel(st.chest, last ? last.at : 100);
  const stage = Math.min(3, Math.round(U.dig.taps / Math.max(1, c.digTaps) * 3));
  const waitGems = st.waiting > 0 && digOn ? '<span class="wait-bubble" aria-hidden="true">' + gemMini(18) + '<b>' + st.waiting + '</b></span>' : '';
  let h = '<section class="card scene' + (st.waiting > 0 && digOn ? ' has-wait' : '') + '" aria-label="Schatzsuche">' +
    '<div class="stage"' + (can ? ' data-act="dig" role="button" tabindex="0" aria-label="Graben. ' + esc(digLabel(st)) + '"' : '') + '>' +
    '<span class="sun" aria-hidden="true"></span><span class="sc-cloud c1" aria-hidden="true"></span><span class="sc-cloud c2" aria-hidden="true"></span>' +
    '<span class="ground" aria-hidden="true"></span>' +
    '<div class="uni-wrap" aria-hidden="true">' + unicornSVG(78) + '</div>' +
    '<div class="girl-wrap" id="girl" aria-hidden="true">' + girlSVG(look(), 150) + '</div>' +
    '<div class="mound s' + stage + '" id="mound" aria-hidden="true"><i class="hole"></i>' + waitGems + '</div>' +
    '<div class="chest-wrap" id="chest" aria-hidden="true">' + chestSVG(level, 136) + '</div>' +
    '<div class="dirt" id="dirt" aria-hidden="true"></div></div>';
  if (!digOn) h += '<div class="scene-bar"><span class="sb-tx"><b>' + dia(st.chest) + ' in der Truhe</b><small>Diamanten fliegen gleich in die Truhe.</small></span></div>';
  else if (U.readonly) h += '<div class="scene-bar"><span class="sb-tx"><b>' + esc(digLabel(st)) + '</b><small>Graben geht nur auf den Geräten der Familie.</small></span></div>';
  else {
    h += '<div class="scene-bar"><button class="digbtn' + (st.waiting > 0 ? ' hot' : '') + '" data-act="dig" aria-label="Graben! ' + esc(digLabel(st)) + (st.waiting > 1 ? ' Gedrückt halten gräbt alle.' : '') + '"' + (can ? '' : ' disabled') + '>' + IC.shovel + '<span>Graben!</span>' + digPips() + '<i class="charge"></i></button>' +
      '<span class="sb-tx"><b id="digLabel">' + esc(digLabel(st)) + '</b>' + (st.waiting > 1 ? '<small>Gedrückt halten gräbt alle aus.</small>' : st.waiting === 1 ? '<small>' + (c.digTaps === 1 ? 'Einmal tippen.' : c.digTaps + '-mal tippen.') + '</small>' : '') + '</span></div>';
  }
  return h + '</section>';
}
/* Für einen früheren Tag: kurze Zusammenfassung statt Szene. */
function pastDayCard(e, ds) {
  const d = parseDate(ds);
  let gems = '';
  for (let i = 0; i < Math.min(e.gain, 10); i++) gems += gemMini(26);
  if (e.gain > 10) gems += '<em>+' + (e.gain - 10) + '</em>';
  const msg = e.perfect ? 'Glitzer-Tag: alles geschafft!' : e.gain > 0 ? dia(e.gain) + ' an diesem Tag' : e.hasData ? 'An diesem Tag gab es keinen Diamanten.' : 'Noch nichts eingetragen.';
  return '<section class="card pad pastday"><div class="pd-top"><b>' + WD_LONG[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS_SHORT[d.getMonth()] + '</b>' + (e.perfect ? crownSVG(30) : '') + '</div>' +
    (gems ? '<div class="pd-gems">' + gems + '</div>' : '') + '<p class="hint">' + msg + '</p></section>';
}

function stampHTML(st) {
  if (st === 'y') return '<div class="stamp y">' + gemMini(30) + '<span>Geschafft!</span></div>';
  if (st === 'c') return '<div class="stamp c">' + IC.sparkle + '<span>Wartet</span></div>';
  if (st === 'n') return '<div class="stamp n">' + IC.moon + '<span>Nicht geschafft</span></div>';
  return '<div class="stamp o"><span>Offen</span></div>';
}
function taskCard(it, ds) {
  const t = it.t, st = it.st, isToday = ds === U.today;
  const fx = U.fx && U.fx.task === t.id ? ' fx' : '';
  const pts = t.pts > 1 ? '<span class="tag">' + t.pts + ' ' + gemMini(14) + '</span>' : '';
  let act;
  if (U.unlocked) act = stampHTML(st);
  else act = '<button class="stamp-btn" data-act="hint" data-task="' + t.id + '" data-st="' + (st || 'o') + '">' + stampHTML(st) + '</button>';
  const seg = U.unlocked ? '<div class="seg two">' +
    '<button class="b-y" data-act="mark" data-task="' + t.id + '" data-st="y" aria-pressed="' + (st === 'y') + '">' + gemMini(20) + '<span>Geschafft</span></button>' +
    '<button class="b-n" data-act="mark" data-task="' + t.id + '" data-st="n" aria-pressed="' + (st === 'n') + '">' + IC.moon + '<span>Nicht geschafft</span></button></div>' : '';
  return '<li class="task st-' + (st || 'o') + fx + (U.unlocked && st === 'c' ? ' claimed' : '') + '" data-task="' + t.id + '">' +
    '<span class="ico" aria-hidden="true">' + esc(t.icon) + '</span>' +
    '<div class="tx"><h3>' + esc(t.title) + pts + '</h3>' + (U.unlocked && st === 'c' ? '<p class="claimed-note">' + esc(S.cfg.name) + ' sagt: geschafft!</p>' : '') + '</div>' +
    '<div class="tact">' + act + '</div>' + seg + '</li>';
}
function taskSections(e, ds) {
  let h = '';
  Object.keys(SLOTS).forEach(slot => {
    const items = e.items.filter(it => (it.t.slot || 'morgens') === slot);
    if (!items.length) return;
    const done = items.filter(it => it.st === 'y').length;
    h += '<div class="sec-h slot-h ' + slot + '"><h2>' + (slot === 'morgens' ? IC.sun : IC.moon) + SLOTS[slot] + '</h2><span class="hint">' + done + ' von ' + items.length + '</span></div>' +
      '<ul class="tasks">' + items.map(it => taskCard(it, ds)).join('') + '</ul>';
  });
  return h;
}

/* Einträge des Tages: Extra-Diamanten und Wolken. Wolken nehmen nur die Eltern zurück. */
function entryRow(en, ds) {
  const c = S.cfg;
  const back = (id, label) => (U.unlocked && id ? '<div class="ev-act"><button class="btn btn-ghost btn-xs" data-act="cloud-back" data-id="' + esc(id) + '" data-ds="' + ds + '">' + label + '</button></div>' : '');
  if (en.k === '+') return '<li class="ev good"><span class="evi">' + gemMini(26) + '</span><span class="evt">' + esc(en.t || 'Extra-Diamant') + '<small>Extra-Diamant</small></span><b class="evv">+' + (en.v || 1) + '</b>' + (U.unlocked && en.id ? '<button class="evx" data-act="ev-del" data-id="' + esc(en.id) + '" aria-label="Eintrag löschen">' + IC.cross + '</button>' : '<span></span>') + '</li>';
  if (en.k === 'y') return '<li class="ev yellow"><span class="evi">' + cloudSVG('yellow', 34) + '</span><span class="evt">' + esc(en.t || 'Gelbe Wolke') + '<small>' + (en.t ? 'Gelbe Wolke · ' : '') + 'Verwarnung' + (c.yellowPts ? ' · Minus ' + c.yellowPts : '') + '</small></span><b class="evv">' + (c.yellowPts ? '−' + c.yellowPts : '') + '</b><span></span>' + back(en.id, 'Wolke zurücknehmen') + '</li>';
  const why = en.auto ? 'Zwei gelbe Wolken' : (en.t || 'Gewitterwolke');
  const eff = en.capped ? 'heute schon Gewitter, kein weiteres Minus' : 'Minus ' + c.redPts;
  return '<li class="ev red"><span class="evi">' + cloudSVG('red', 34) + '</span><span class="evt">' + esc(why) + '<small>' + (en.auto ? 'Automatisch Gewitter' : 'Gewitterwolke') + ' · ' + eff + '</small></span><b class="evv">' + (en.capped ? '' : '−' + c.redPts) + '</b><span></span>' +
    (en.auto ? back(en.src, 'Zweite gelbe Wolke zurücknehmen') : back(en.id, 'Wolke zurücknehmen')) + '</li>';
}
function extrasCard(e, ds) {
  const isToday = ds === U.today, c = S.cfg;
  if (!U.unlocked && !e.entries.length) return '';
  let btns = '';
  if (U.unlocked) {
    const left = Math.max(0, c.extraMax - e.plus);
    btns = '<div class="xbtns">' +
      '<button class="xbtn wide" data-act="extra-open" data-k="+">' + gemMini(30) + '<span>Extra-Diamant</span><small>Für etwas Besonderes, frei eingeben' + (left <= 0 ? ' · heute keine mehr' : '') + '</small></button>';
    if (!isToday) btns += '</div><p class="hint">Wolken gibt es nur am selben Tag.</p>';
    else if (!c.cloudsAck) btns += '<button class="xbtn wide" data-act="clouds-unlock">' + cloudSVG('yellow', 34) + '<span>Wolken freischalten</span><small>Erst die Hinweise für Eltern lesen</small></button></div>';
    else btns += '<button class="xbtn" data-act="extra-open" data-k="y">' + cloudSVG('yellow', 36) + '<span>Gelbe Wolke</span></button>' +
      '<button class="xbtn" data-act="extra-open" data-k="r"' + (e.red > 0 ? ' disabled' : '') + '>' + cloudSVG('red', 36) + '<span>' + (e.red > 0 ? 'Gewitter (schon)' : 'Gewitter') + '</span></button></div>';
  }
  const list = e.entries.length ? '<ul class="evs">' + e.entries.map(en => entryRow(en, ds)).join('') + '</ul>' : '';
  return '<section class="card extras" aria-label="Extras und Wolken"><div class="sec-h"><h2>Extras &amp; Wolken</h2><button class="btn btn-ghost btn-sm" data-act="rules">Regeln</button></div>' + btns + list + '</section>';
}
function dayTools(e) {
  if (!U.unlocked) return '';
  const claimed = e.items.filter(it => it.st === 'c').length, open = e.items.filter(it => !it.st || it.st === 'c').length;
  if (!open) return '';
  return '<div class="day-tools">' + (claimed ? '<button class="btn btn-main btn-sm" data-act="approve-claimed">' + IC.check + 'Getippte: geschafft (' + claimed + ')</button>' : '') +
    '<button class="btn btn-ghost btn-sm" data-act="all-ok">' + gemMini(18) + 'Alle offenen: geschafft</button><button class="btn btn-ghost btn-sm" data-act="rest-no">' + IC.moon + 'Rest: nicht geschafft</button></div>';
}

/* Unter den Aufgaben: der nächste Schatz mit Zähler und der nächste Zauberbeutel. Tippen führt zu den Schätzen. */
function nextTreasureCard(st) {
  const gl = goalList(S, st), ng = gl.find(g => !g.reached), p = st.packs;
  const waiting = gl.filter(g => g.reached && !g.done);
  let h = '<div class="sec-h"><h2>Nächster Schatz</h2></div><button class="card nextgoal" data-act="tab" data-tab="achieve" aria-label="Zu den Schätzen">';
  if (waiting.length) h += '<span class="ng-wait">' + IC.gift + '<span><b>Schatz gefunden!</b> Deine Belohnung wartet' + (waiting.length > 1 ? ' (' + waiting.length + ' Schätze)' : '') + '.</span></span>';
  if (ng) {
    const pct = clamp(Math.round((st.score - ng.prev) / Math.max(1, ng.at - ng.prev) * 100), 0, 100);
    h += '<span class="ng-main"><span class="ng-ico">' + (ng.last ? crownSVG(52) : gemSVG(ng.gem, 50)) + '</span><span class="ng-tx"><b>Noch ' + dia(ng.need) + '</b><small>' + goalText(ng) + '</small></span><span class="ng-cnt">' + signed(st.score) + '<i>/</i>' + ng.at + '</span></span>' +
      '<span class="ng-bar" aria-hidden="true"><i style="width:' + pct + '%"></i></span>' +
      (st.minus ? '<span class="ng-note">' + dia(st.total) + ' gesamt, minus ' + st.minus + ' durch Wolken</span>' : '');
  } else h += '<span class="ng-main"><span class="ng-ico">' + crownSVG(52) + '</span><span class="ng-tx"><b>Alle Schätze gefunden!</b><small>Mama und Papa verstecken bald neue.</small></span></span>';
  h += '<span class="ng-pack">' + pouchSVG(32) + '<span>' + (p.left ? '<b>' + (p.left === 1 ? 'Ein Zauberbeutel wartet' : p.left + ' Zauberbeutel warten') + '</b> bei den Schätzen' : 'Noch <b>' + dia(p.next) + '</b> bis zum nächsten Zauberbeutel') + '</span></span></button>';
  return h;
}
function viewToday(st) {
  const ds = U.date, e = evalDay(S, ds), isToday = ds === U.today;
  let h = (isToday ? cloudTop(st) : '') + modeNote() + dayStrip(ds);
  if (isToday) h += sceneCard(st);
  else h += '<button class="btn btn-ghost btn-sm back-today" data-act="goto-today">' + IC.back + 'Zurück zu heute</button>' + pastDayCard(e, ds);
  h += dayTools(e);
  if (!e.items.length) h += '<div class="card pad"><p class="hint">An diesem Tag gibt es keine Aufgaben.</p></div>';
  else h += taskSections(e, ds);
  h += extrasCard(e, ds);
  if (isToday) h += nextTreasureCard(st);
  if (isToday && S.cfg.games !== false) h += gamesCard();
  h += installHint();
  return h;
}
/* Spielwiese: Mini-Spiele nur zum Spaß (zählen nicht für Diamanten). Die Spiele selbst stehen in games.js. */

  return '<div class="sec-h"><h2>Spielwiese</h2><span class="hint">Nur zum Spaß</span></div><section class="card games" aria-label="Mini-Spiele"><div class="gtiles">' +

    '</div></section>';
}
/* Auf dem iPhone, solange die Seite noch in Safari läuft: wie sie auf den Home-Bildschirm kommt. */

  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

/* ---------- Tag, Meilensteine ---------- */
function ensureDay(ds) {
  const d = S.days[ds] || (S.days[ds] = {});
  if (!d.m) d.m = {};
  if (!d.ev) d.ev = [];
  return d;
}
const snap = ds => milestones(S, ds, U.today);
const savedDay = ds => persist('days/' + ds);

/* Merkt sich, wann ein Schatz erreicht wurde („Gefunden am …“). Wird er durch eine Wolke wieder verfehlt, fällt das Datum (und die Feier) weg. */
function afterMutation(ds, b) {
  const a = snap(ds), cel = S.prog.cel, shown = S.prog.shown || (S.prog.shown = {});
  let dirty = false;
  b.goals.filter(id => a.goals.indexOf(id) < 0).forEach(id => { if (cel['g:' + id]) { delete cel['g:' + id]; dirty = true; } if (shown[id]) { delete shown[id]; dirty = true; } });
  a.goals.filter(id => b.goals.indexOf(id) < 0).forEach(id => { if (!cel['g:' + id]) { cel['g:' + id] = U.today; dirty = true; } });
  if (dirty) persist('cfg/progress');
  scheduleCeleb(700);
}
function scheduleCeleb(ms) { clearTimeout(celebT); celebT = setTimeout(checkCelebs, ms); }

/* ---------- Feiern: aus den Daten abgeleitet, damit sie auch geräteübergreifend genau einmal kommen ----------
   Gefeiert wird erst, wenn nichts mehr in der Erde wartet (Feier nach dem Graben). Was gezeigt wurde, steht in cfg/progress. */
function celebBlocked() { return !U.ready || U.readonly || Store.noAccess || Store.gate || U.celeb || U.pack || U.sheet || U.digBusy || U.volley || U.holdAt != null; }
function checkCelebs() {
  if (celebBlocked()) { if (U.ready && !U.readonly && !Store.gate) { clearTimeout(celebT); celebT = setTimeout(checkCelebs, 900); } return; }
  const st = ST(), prog = S.prog, shown = prog.shown || (prog.shown = {}), cel = prog.cel;
  if (st.waiting > 0 && S.cfg.digMode !== false) return;
  let dirty = false;
  const gl = goalList(S, st);
  gl.forEach(g => { if (g.reached && !shown[g.id]) { shown[g.id] = 1; dirty = true; if (!g.done) U.celebQ.push({ type: g.last ? 'treasure' : 'goal', id: g.id }); if (!cel['g:' + g.id]) cel['g:' + g.id] = U.today; } });
  const e = evalDay(S, U.today);
  if (e.perfect && !cel['p:' + U.today]) { cel['p:' + U.today] = 1; dirty = true; U.celebQ.push({ type: 'perfect' }); }
  if (prog.packN == null) { prog.packN = st.packs.earned; dirty = true; }
  else if (st.packs.earned > prog.packN) { U.packNote = (U.packNote || 0) + st.packs.earned - prog.packN; prog.packN = st.packs.earned; dirty = true; }
  if (dirty) persist('cfg/progress');
  showNextCeleb();
}

const rewardBox = txt => '<div class="ce-reward"><span class="gift" aria-hidden="true">' + IC.gift + '</span><div><b>Deine Belohnung</b><span>' + (String(txt || '').trim() ? esc(txt) : 'Eine Überraschung! Mama und Papa verraten sie dir.') + '</span></div></div>';
function showNextCeleb() {

      { transform: 'translate(' + x0 + 'px,' + (y0 - 50) + 'px) scale(1.3) rotate(-12deg)', opacity: 1, offset: .35 },
      { transform: 'translate(' + ((x0 + x1) / 2) + 'px,' + (Math.min(y0, y1) - 80) + 'px) scale(1.1) rotate(8deg)', offset: .65 },

async function hashPin(pin) {
  try {
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('diamanten|' + pin));
    return 'h:' + Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'p:' + pin; }
}
const checkPin = async p => { const c = S.cfg.pin; return c === 'p:' + p || c === (await hashPin(p)); };
function pinHTML(mode, msg) {
  const t = { enter: 'Eltern-Code', set: 'Neuen Code festlegen', again: 'Code wiederholen' }[mode];
  const sub = msg || { enter: 'Nur Mama und Papa geben Diamanten frei.', set: 'Vier Ziffern. Der Code schützt nur vor versehentlichem Tippen.', again: 'Noch einmal zur Sicherheit.' }[mode];
  return '<h2>' + t + '</h2><p class="sub">' + sub + '</p><div class="pin-dots" id="pindots" aria-live="polite">' + [0, 1, 2, 3].map(i => '<i' + (i < U.pin.length ? ' class="on"' : '') + '></i>').join('') + '</div>' +
    '<div class="pad4">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => '<button data-act="pin-key" data-n="' + n + '">' + n + '</button>').join('') +
    '<button class="ghost" data-act="sheet-close">Zurück</button><button data-act="pin-key" data-n="0">0</button><button class="ghost" data-act="pin-del" aria-label="Löschen">⌫</button></div>';
}
function openPin(mode) { U.pin = ''; U.pinMode = mode; U.pinFirst = ''; openSheet(pinHTML(mode), 'sheet-pin'); }
const paintPin = () => $$('#pindots i').forEach((d, i) => d.classList.toggle('on', i < U.pin.length));
function badPin() {
  const d = $('#pindots'); if (d) { d.classList.add('bad'); setTimeout(() => { d.classList.remove('bad'); U.pin = ''; paintPin(); }, 450); }
  Snd.soft(); Hap.go([30, 40, 30]);
}

ACT['pin-key'] = async el => {

};

function stepTarget(obj) {
  const [kind, id] = obj.split(':');
  if (kind === 'cfg') return S.cfg;
  if (kind === 'goal') return S.cfg.goals.find(g => g.id === id);
  if (kind === 'task') return taskById(id);
  return null;
}
ACT.step = el => {
  const o = stepTarget(el.dataset.obj), key = el.dataset.key; if (!o) return;
  let v = clamp((+o[key] || 0) + (+el.dataset.d), +el.dataset.min, +el.dataset.max);
  if (el.dataset.obj.indexOf('goal:') === 0) {
    const gs = S.cfg.goals, i = gs.indexOf(o);
    v = Math.max(v, i > 0 ? gs[i - 1].at + 1 : 1);
    if (i < gs.length - 1) v = Math.min(v, gs[i + 1].at - 1);
  }
  o[key] = v; if (key === 'digTaps') U.dig.taps = 0;
  markChanged(); persist('cfg/main', 400); render();
};
